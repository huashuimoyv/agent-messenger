name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (defaults to v<package.json version>, e.g. v0.1.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark GitHub Release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.9+
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.9.0 <25'
          cache: 'npm'

      - name: Verify Node.js version
        shell: bash
        run: |
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 24 || (maj === 24 && min < 9)) {
              throw new Error(`Node.js >=24.9.0 is required, got ${process.versions.node}`);
            }
            console.log(`Using Node.js ${process.version}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build and package runtime archive
        run: npm run package

      - name: Verify packaged runtime archive
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "String(require('./package.json').version || '').trim()")"
          STAGE_DIR="${RUNNER_TEMP}/runtime-verify"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}" "${RUNNER_TEMP}/verify-home"

          unzip -t dist/agent-messenger-runtime.zip
          unzip -q dist/agent-messenger-runtime.zip -d "${STAGE_DIR}"

          for rel in \
            agent-messenger.mjs \
            README.txt \
            THIRD_PARTY_LICENSES.txt \
            LICENSE \
            NOTICE \
            ui/index.html \
            scripts/install.mjs \
            plugins/pi/agent-messenger.ts
          do
            test -f "${STAGE_DIR}/${rel}" || { echo "Missing packaged file: ${rel}" >&2; exit 1; }
          done

          head -n 1 "${STAGE_DIR}/README.txt" | tr -d '\r' | grep -Fx "Agent Messenger ${PKG_VERSION}"
          head -n 1 "${STAGE_DIR}/agent-messenger.mjs" | grep -Fq "/* Agent Messenger ${PKG_VERSION}."

          HOME="${RUNNER_TEMP}/verify-home" node "${STAGE_DIR}/scripts/install.mjs" --check

          node --disable-warning=ExperimentalWarning --input-type=module -e '
            import { spawn } from "node:child_process";
            import path from "node:path";
            const [stage, expectedVersion] = process.argv.slice(1);
            const child = spawn(process.execPath, ["--disable-warning=ExperimentalWarning", path.join(stage, "agent-messenger.mjs")], {
              stdio: ["pipe", "pipe", "pipe"],
              env: { ...process.env, AGENT_MESSENGER_HOME: path.join(stage, "data"), AGENT_MESSENGER_DASHBOARD: "0" },
            });
            let out = "";
            let err = "";
            let settled = false;
            const fail = msg => {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              try { child.kill(); } catch {}
              console.error(msg);
              process.exit(1);
            };
            const timer = setTimeout(() => fail("Timed out waiting for packaged MCP initialize"), 8000);
            child.on("error", e => fail(e.message));
            child.on("exit", code => {
              if (!settled) fail(`Packaged bundle exited early with code ${code}: ${err}`);
            });
            child.stderr.on("data", chunk => { err += chunk.toString(); });
            child.stdout.on("data", chunk => {
              out += chunk.toString();
              let nl;
              while ((nl = out.indexOf("\n")) !== -1) {
                const line = out.slice(0, nl).trim();
                out = out.slice(nl + 1);
                if (!line) continue;
                const msg = JSON.parse(line);
                if (msg.id === 1) {
                  if (err) {
                    fail(`Unexpected stderr: ${err}`);
                    return;
                  }
                  if (msg.result?.serverInfo?.name !== "agent-messenger" || msg.result?.serverInfo?.version !== expectedVersion) {
                    fail(`Unexpected serverInfo: ${JSON.stringify(msg.result?.serverInfo)} (expected version ${expectedVersion})`);
                    return;
                  }
                  settled = true;
                  clearTimeout(timer);
                  child.stdin.end();
                  child.kill();
                  console.log("Packaged bundle MCP initialize OK:", JSON.stringify(msg.result.serverInfo));
                  process.exit(0);
                }
              }
            });
            child.stdin.write(JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "initialize",
              params: { protocolVersion: "2025-11-25", capabilities: {}, clientInfo: { name: "ci-smoke", version: "1.0.0" } },
            }) + "\n");
          ' "${STAGE_DIR}" "${PKG_VERSION}"

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "String(require('./package.json').version || '').trim()")"
          if [ -z "${PKG_VERSION}" ] || [[ "${PKG_VERSION}" =~ [[:space:]] ]]; then
            echo "Invalid package.json version: '${PKG_VERSION}'" >&2
            exit 1
          fi

          if [ "${EVENT_NAME}" = "push" ]; then
            TAG="${REF_NAME}"
          else
            TRIMMED_INPUT_TAG="$(printf '%s' "${INPUT_TAG}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            TAG="${TRIMMED_INPUT_TAG:-v${PKG_VERSION}}"
          fi

          if [ -z "${TAG}" ] || [[ "${TAG}" =~ [[:space:]] ]]; then
            echo "Invalid release tag: '${TAG}'" >&2
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::warning::Release tag '${TAG}' does not match package.json version '${PKG_VERSION}'."
          fi

          IS_PRERELEASE="false"
          if [ "${INPUT_PRERELEASE}" = "true" ] || [[ "${TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          SHA256="$(sha256sum dist/agent-messenger-runtime.zip | awk '{print $1}')"
          {
            echo "tag=${TAG}"
            echo "pkg_version=${PKG_VERSION}"
            echo "prerelease=${IS_PRERELEASE}"
            echo "sha256=${SHA256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PKG_VERSION: ${{ steps.meta.outputs.pkg_version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          ZIP_SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          node -e '
            const fs = require("node:fs");
            const [file, ver, sha] = process.argv.slice(1);
            fs.writeFileSync(file, [
              "<!-- agent-messenger-runtime-notes:start -->",
              "### Runtime Package",
              `- Version: \`${ver}\` (Node.js 24.9.0+ required, zero npm runtime dependencies)`,
              "- Asset: `agent-messenger-runtime.zip`",
              `- SHA-256: \`${sha}\``,
              "",
              "### Quick Setup",
              "Extract `agent-messenger-runtime.zip` and run:",
              "```bash",
              "node scripts/install.mjs",
              "```",
              "<!-- agent-messenger-runtime-notes:end -->",
              "",
            ].join("\n"), "utf8");
          ' "${NOTES_FILE}" "${PKG_VERSION}" "${ZIP_SHA256}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating asset and package notes..."
            gh release upload "${TAG}" dist/agent-messenger-runtime.zip --clobber
            EXISTING_BODY_FILE="${RUNNER_TEMP}/release-body-existing.md"
            UPDATED_NOTES_FILE="${RUNNER_TEMP}/release-notes-updated.md"
            gh release view "${TAG}" --json body -q .body > "${EXISTING_BODY_FILE}" || : > "${EXISTING_BODY_FILE}"
            node -e '
              const fs = require("node:fs");
              const [notesFile, existingFile, outFile] = process.argv.slice(1);
              const block = fs.readFileSync(notesFile, "utf8").trimEnd();
              const existing = fs.readFileSync(existingFile, "utf8");
              const start = "<!-- agent-messenger-runtime-notes:start -->";
              const end = "<!-- agent-messenger-runtime-notes:end -->";
              const sIdx = existing.indexOf(start);
              const eIdx = existing.indexOf(end);
              let next;
              if (sIdx !== -1 && eIdx !== -1 && eIdx >= sIdx) {
                next = existing.slice(0, sIdx) + block + existing.slice(eIdx + end.length);
              } else if (existing.trim()) {
                next = block + "\n\n" + existing.trimStart();
              } else {
                next = block;
              }
              fs.writeFileSync(outFile, next.trimEnd() + "\n", "utf8");
            ' "${NOTES_FILE}" "${EXISTING_BODY_FILE}" "${UPDATED_NOTES_FILE}"
            gh release edit "${TAG}" --notes-file "${UPDATED_NOTES_FILE}"
          else
            ARGS=("${TAG}" "dist/agent-messenger-runtime.zip" "--title" "${TAG}" "--notes" "$(cat "${NOTES_FILE}")" "--generate-notes")
            if [ "${IS_PRERELEASE}" = "true" ]; then
              ARGS+=("--prerelease")
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              ARGS+=("--target" "${GITHUB_SHA}")
            fi
            gh release create "${ARGS[@]}"
          fi
